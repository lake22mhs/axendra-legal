name: Deploy Axendra website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "community-rules/**"
      - "privacy-policy/**"
      - "terms-of-use/**"
      - "delete-account/**"
      - ".github/workflows/deploy-axendra-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website and legal pages
        run: |
          mkdir -p .pages
          cp -R website/. .pages/
          cp -R community-rules privacy-policy terms-of-use delete-account .pages/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
